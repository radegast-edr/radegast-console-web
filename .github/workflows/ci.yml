name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Required status check on main: Socket Fix PRs only auto-merge once this passes
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "26"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Report failing tests without blocking the merge; only lint and build gate it
      - name: Test
        id: test
        continue-on-error: true
        run: npm test -- --reporter=default --reporter=github-actions

      - name: Flag test failures
        if: steps.test.outcome == 'failure'
        run: echo "::warning::Tests failed (not blocking merge). See the Test step and annotations for details."

      - name: Build
        run: npm run build
